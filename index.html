<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big 3 Archive | Ultimate Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --accent: #ff4500;
            --bg: #050505;
            --card-bg: #0f0f0f;
            --text-main: #ffffff;
            --text-dim: #b0b0b0;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }
        body {
            background-color: var(--bg);
            color: var(--text-dim);
            font-family: 'Roboto', sans-serif;
            background-image: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #050505 80%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        h1, h2, h3, h4, h5, .navbar-brand {
            font-family: 'Space Grotesk', sans-serif;
            color: var(--text-main) !important;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .nexus-nav {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 15px 0;
        }
        .nav-link-custom {
            background: transparent;
            border: none;
            color: #777;
            font-weight: 700;
            padding: 10px 20px;
            transition: 0.4s;
            position: relative;
        }
        .nav-link-custom.active { color: var(--accent) !important; }
        .nav-link-custom.active::after {
            content: ''; position: absolute; bottom: 0; left: 25%; width: 50%; height: 3px; background: var(--accent); border-radius: 10px;
        }
        .char-tag {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 10px;
            transition: 0.3s;
            cursor: pointer;
            text-align: center;
        }
        .char-tag:hover {
            border-color: var(--accent);
            transform: translateY(-5px);
            background: rgba(255, 69, 0, 0.05);
        }
        .char-thumb {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 8px;
        }
        .main-display {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 35px;
            padding: 45px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .info-toggle-group .btn {
            border: 1px solid var(--border);
            color: var(--text-dim);
            font-weight: 600;
            transition: 0.3s;
            flex: 1;
        }
        .info-toggle-group .btn.active {
            background: var(--text-main);
            color: #000 !important;
        }
        .modal-content {
            background: #0f0f0f;
            border: 1px solid var(--accent);
            border-radius: 25px;
            color: var(--text-dim);
            backdrop-filter: blur(20px);
        }
        .lore-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
        }
        .lore-label {
            color: var(--accent);
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            display: block;
            margin-bottom: 5px;
        }
        .meme-card {
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: #111;
            border: 1px solid #222;
            border-radius: 15px;
            height: 100%;
        }
        .meme-card:hover {
            transform: rotate(2deg) scale(1.05);
            border-color: var(--accent) !important;
        }
        .meme-card img {
            border: 4px solid #fff;
            margin-bottom: 15px;
            max-height: 200px;
            width: 100%;
            object-fit: cover;
        }
        .accent-txt { color: var(--accent) !important; }
        .btn-close-white { filter: invert(1) grayscale(100%) brightness(200%); }
    </style>
</head>
<body>

<nav class="nexus-nav mb-5">
    <div class="container d-flex justify-content-between align-items-center">
        <span class="navbar-brand m-0">BIG3<span class="accent-txt">ARCHIVE</span></span>
        <div class="d-flex gap-2">
            <button class="nav-link-custom active" id="tab-21" onclick="switchSeries(21, '#ff4500')">ONE PIECE</button>
            <button class="nav-link-custom" id="tab-20" onclick="switchSeries(20, '#ffa500')">NARUTO</button>
            <button class="nav-link-custom" id="tab-269" onclick="switchSeries(269, '#009dff')">BLEACH</button>
        </div>
    </div>
</nav>

<div class="container pb-5">
    <div id="loader" class="text-center py-5 d-none">
        <div class="spinner-border accent-txt" role="status"></div>
    </div>
    
    <div id="app-root" class="main-display animate__animated animate__fadeIn"></div>

    <section class="py-5 mt-5 border-top border-secondary">
        <div class="text-center mb-5">
            <h2 class="display-6 fw-bold"><i class="fa-solid fa-face-grin-tears accent-txt"></i> MEME HALL OF FAME</h2>
        </div>
        <div class="row g-4 justify-content-center">
            <div class="col-md-4">
                <div class="meme-card p-3 text-center">
                    <img src="CON D. ORIANO.jfif" class="img-fluid rounded" alt="Con D. Oriano">
                    <h5 class="text-white fw-bold">CON D. ORIANO</h5>
                    <p class="small text-muted">"The legend of G-8."</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="meme-card p-3 text-center">
                    <img src="51.jfif" class="img-fluid rounded" alt="Naruto Run">
                    <h5 class="text-white fw-bold">AREA 51 SURVIVOR</h5>
                    <p class="small text-muted">"Infinite Speed."</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="meme-card p-3 text-center">
                    <img src="chairsama.jfif" class="img-fluid rounded" alt="Chair-sama">
                    <h5 class="text-white fw-bold">CHAIR-SAMA</h5>
                    <p class="small text-muted">"The strongest antagonist."</p>
                </div>
            </div>
        </div>
    </section>
</div>

<div class="modal fade" id="charModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content p-3">
            <div class="modal-header border-0">
                <h5 class="modal-title fw-bold accent-txt" id="modalCharName"></h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body pt-0">
                <div class="row align-items-center">
                    <div class="col-4"><img id="modalCharImg" src="" class="img-fluid rounded-4 border border-secondary"></div>
                    <div class="col-8">
                        <p id="modalCharRole" class="small text-white-50 mb-1"></p>
                        <p id="modalCharAbout" class="small mb-0"></p>
                    </div>
                </div>
                <div class="p-3 mt-3 bg-dark rounded-3 border-start border-4 border-warning">
                    <h6 class="small fw-bold text-warning mb-1">TRIVIA & NICKNAMES</h6>
                    <p id="modalCharTrivia" class="small m-0 text-white italic"></p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const charTriviaDB = {
        "Monkey D., Luffy": "Nickname: 'Straw Hat'. Title: 'Sun God Nika'. Emperor of the Sea.",
        "Roronoa, Zoro": "Nickname: 'Pirate Hunter'. Master of Enma and the Three Sword Style.",
        "Sanji": "Nickname: 'Black Leg'. Prince of Germa 66 and master of Diable Jambe.",
        "Jinbe": "Nickname: 'First Knight of the Sea'. A powerful Fish-man master of Karate.",
        "King": "True Name: Alber. A Lunarian survivor who served as Kaido's right hand.",
        "Uzumaki, Naruto": "Titles: 'Hero of the Hidden Leaf', 'Seventh Hokage', 'Nine-Tails Jinchuriki'.",
        "Uchiha, Sasuke": "Titles: 'The Supporting Kage', 'Shadow of the Shinobi World'.",
        "Kurosaki, Ichigo": "Title: 'Substitute Shinigami'. The ultimate Hybrid of all races.",
        "Kuchiki, Rukia": "Title: 'Captain of the 13th Division'. Wielder of Sode no Shirayuki.",
        "Abarai, Renji": "Nickname: 'Red Pineapple'. A powerful Shinigami with the roar of Zabimaru.",
        "Ishida, Uryu": "Title: 'The Last Quincy'. Prince of the Wandenreich under Yhwach."
    };

    const loreDatabase = {
        21: [
            { label: "Fish-men", content: "A race primarily residing in Fish-man Island. Ten times stronger than humans from birth. <strong>Example: Jinbe.</strong>" },
            { label: "Lunarians", content: "A near-extinct 'God' race from the Red Line capable of fire manipulation and immense durability. <strong>Example: King (Alber).</strong>" },
            { label: "The Will of D", content: "A mysterious lineage known as the 'Natural Enemies of God' (Celestial Dragons)." }
        ],
        20: [
            { label: "Jinchuriki", content: "Humans who have a Tailed Beast (Bijuu) sealed within them. They gain massive chakra but face social isolation. <strong>Example: Naruto (Kurama).</strong>" },
            { label: "Otsutsuki Clan", content: "Celestial beings who travel dimensions to plant Divine Trees and harvest Chakra Fruit." },
            { label: "Boruto Era", content: "A technologically advanced age where the legacy of Shinobi is threatened by scientific ninja tools and Karma marks." }
        ],
        269: [
            { label: "Shinigami", content: "Soul Reapers who maintain the balance between the Human World and Soul Society. <strong>Example: Renji.</strong>" },
            { label: "Quincy", content: "Humans who can manipulate Reishi. Unlike Shinigami, they completely destroy Hollows. <strong>Example: Uryu Ishida.</strong>" },
            { label: "The Hybrid Case", content: "<strong>Ichigo Kurosaki</strong> is a unique entity containing Shinigami, Quincy, and Hollow powers simultaneously." }
        ]
    };

    let charModal;
    let animeData = null;
    let charData = [];
    let activeTab = 'story';

    async function switchSeries(id, color) {
        document.documentElement.style.setProperty('--accent', color);
        document.querySelectorAll('.nav-link-custom').forEach(b => b.classList.toggle('active', b.id === `tab-${id}`));
        activeTab = 'story';
        await loadSeries(id);
    }

    async function loadSeries(id) {
        const root = document.getElementById('app-root');
        const loader = document.getElementById('loader');
        root.style.display = 'none';
        loader.classList.remove('d-none');
        try {
            const [aRes, cRes] = await Promise.all([
                fetch(`https://api.jikan.moe/v4/anime/${id}`),
                fetch(`https://api.jikan.moe/v4/anime/${id}/characters`)
            ]);
            animeData = (await aRes.json()).data;
            charData = (await cRes.json()).data.slice(0, 12);
            loader.classList.add('d-none');
            root.style.display = 'block';
            render();
        } catch (e) {
            root.innerHTML = `<h5 class="text-center p-5">Service Unavailable. Please refresh.</h5>`;
            loader.classList.add('d-none');
            root.style.display = 'block';
        }
    }

    function render() {
        const root = document.getElementById('app-root');
        const anime = animeData;
        root.innerHTML = `
            <div class="row g-5">
                <div class="col-lg-4 animate__animated animate__fadeInLeft text-center">
                    <img src="${anime.images.jpg.large_image_url}" class="img-fluid rounded-5 shadow-lg border border-secondary mb-4">
                    <div class="p-3 bg-dark rounded-4 border border-secondary">
                        <small class="accent-txt fw-bold d-block mb-1">SCORE</small>
                        <h5 class="text-white m-0">⭐ ${anime.score || 'N/A'}</h5>
                    </div>
                </div>
                <div class="col-lg-8 animate__animated animate__fadeInRight">
                    <h1 class="display-5 fw-bold mb-3">${anime.title}</h1>
                    <div class="btn-group info-toggle-group mb-4 w-100">
                        <button class="btn ${activeTab === 'story' ? 'active' : ''}" onclick="setTab('story')">STORY</button>
                        <button class="btn ${activeTab === 'lore' ? 'active' : ''}" onclick="setTab('lore')">RACES & LORE</button>
                        <button class="btn ${activeTab === 'stats' ? 'active' : ''}" onclick="setTab('stats')">DATA</button>
                    </div>
                    <div class="mb-4">
                        ${activeTab === 'story' ? `<p class="lead" style="line-height:1.8">${anime.synopsis}</p>` : 
                          activeTab === 'lore' ? `<div class="animate__animated animate__fadeInUp">
                            ${loreDatabase[anime.mal_id].map(l => `
                                <div class="lore-item">
                                    <span class="lore-label">${l.label}</span>
                                    <p class="small m-0 text-white">${l.content}</p>
                                </div>
                            `).join('')}
                          </div>` : 
                        `<div class="row g-3">
                            <div class="col-6"><div class="p-3 bg-dark rounded-3 border border-secondary"><small class="text-muted d-block">Episodes</small>${anime.episodes || 'Ongoing'}</div></div>
                            <div class="col-6"><div class="p-3 bg-dark rounded-3 border border-secondary"><small class="text-muted d-block">Status</small>${anime.status}</div></div>
                        </div>`}
                    </div>
                    <h4 class="accent-txt mb-3 fw-bold">CHARACTER DOSSIERS</h4>
                    <div class="row g-2">
                        ${charData.map((c, i) => `
                            <div class="col-4 col-md-3">
                                <div class="char-tag" onclick="openDossier(${i})">
                                    <img src="${c.character.images.jpg.image_url}" class="char-thumb">
                                    <p class="small fw-bold text-white m-0 text-truncate">${c.character.name}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            </div>
        `;
    }

    function setTab(t) { activeTab = t; render(); }

    function openDossier(idx) {
        const char = charData[idx];
        document.getElementById('modalCharName').innerText = char.character.name;
        document.getElementById('modalCharImg').src = char.character.images.jpg.image_url;
        document.getElementById('modalCharRole').innerText = `Role: ${char.role}`;
        document.getElementById('modalCharAbout').innerText = `Appears in ${animeData.title}. Character Rank: ${char.favorites} Favorites.`;
        document.getElementById('modalCharTrivia').innerText = `"${charTriviaDB[char.character.name] || 'No restricted data available for this profile.'}"`;
        charModal.show();
    }

    window.onload = () => {
        charModal = new bootstrap.Modal(document.getElementById('charModal'));
        switchSeries(21, '#ff4500');
    };
</script>
</body>
</html>
