<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shonen Giants | Multi-Series Archive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --op-color: #ff4500;
            --nr-color: #ffa500;
            --bl-color: #009dff;
            --bg-dark: #080808;
            --glass: rgba(255, 255, 255, 0.03);
        }

        body {
            background-color: var(--bg-dark);
            color: #f0f0f0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* UI Styling */
        .hero-section {
            padding: 80px 0;
            background: radial-gradient(circle at top right, #1a1a1a, #080808);
        }

        .nav-pills .nav-link {
            color: #888;
            border-radius: 50px;
            padding: 10px 25px;
            font-weight: 600;
            border: 1px solid transparent;
            transition: 0.3s;
        }

        .nav-pills .nav-link.active {
            background-color: var(--glass) !important;
            border-color: #444;
            color: #fff !important;
        }

        .character-card {
            background: var(--glass);
            border: 1px solid #222;
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .character-card:hover {
            transform: translateY(-5px);
            border-color: #555;
        }

        .char-img {
            height: 250px;
            width: 100%;
            object-fit: cover;
            filter: grayscale(30%);
            transition: 0.3s;
        }

        .character-card:hover .char-img {
            filter: grayscale(0%);
        }

        .detail-box {
            background: #111;
            border-radius: 20px;
            padding: 30px;
            border-left: 4px solid var(--op-color);
        }

        .section-title {
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>
<body>

<div class="hero-section border-bottom border-secondary">
    <div class="container text-center">
        <h1 class="display-3 fw-800 mb-3">SHONEN <span style="color: var(--op-color);">GIANTS</span></h1>
        <p class="text-muted mb-5">Exploring the worlds of Oda, Kishimoto, and Kubo.</p>
        
        <ul class="nav nav-pills justify-content-center mb-5" id="animeTabs" role="tablist">
            <li class="nav-item">
                <button class="nav-link active" id="op-tab" data-bs-toggle="pill" data-bs-target="#one-piece" onclick="loadDetails(21, 'one-piece')">One Piece</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" id="nr-tab" data-bs-toggle="pill" data-bs-target="#naruto" onclick="loadDetails(20, 'naruto')">Naruto</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" id="bl-tab" data-bs-toggle="pill" data-bs-target="#bleach" onclick="loadDetails(269, 'bleach')">Bleach</button>
            </li>
        </ul>
    </div>
</div>

<div class="container py-5">
    <div class="tab-content" id="animeContent">
        <div class="tab-pane fade show active" id="main-display">
            <div id="loading-view" class="text-center py-5">
                <div class="spinner-border text-danger"></div>
            </div>
            <div id="content-view"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    async function loadDetails(id, type) {
        const contentView = document.getElementById('content-view');
        const loader = document.getElementById('loading-view');
        
        contentView.style.opacity = '0';
        loader.classList.remove('d-none');

        try {

            const [animeRes, charRes] = await Promise.all([
                fetch(`https://api.jikan.moe/v4/anime/${id}`),
                fetch(`https://api.jikan.moe/v4/anime/${id}/characters`)
            ]);

            const animeData = await animeRes.json();
            const charData = await charRes.json();
            
            const anime = animeData.data;
            const topChars = charData.data.slice(0, 4); // Get top 4 main characters

            let html = `
                <div class="row g-5">
                    <div class="col-lg-4">
                        <img src="${anime.images.jpg.large_image_url}" class="img-fluid rounded-4 shadow-lg mb-4" alt="${anime.title}">
                        <div class="detail-box">
                            <p class="section-title mb-1">Status</p>
                            <p class="mb-3">${anime.status}</p>
                            <p class="section-title mb-1">Episodes</p>
                            <p class="mb-3">${anime.episodes || 'Ongoing'}</p>
                            <p class="section-title mb-1">Score</p>
                            <p class="h4 text-warning">⭐ ${anime.score}</p>
                        </div>
                    </div>
                    <div class="col-lg-8">
                        <h2 class="display-5 fw-bold mb-3">${anime.title}</h2>
                        <p class="lead text-muted mb-4">${anime.synopsis}</p>
                        
                        <h3 class="h4 fw-bold mt-5 mb-4 border-bottom border-dark pb-2">Main Characters</h3>
                        <div class="row g-3">
                            ${topChars.map(c => `
                                <div class="col-6 col-md-3">
                                    <div class="character-card">
                                        <img src="${c.character.images.jpg.image_url}" class="char-img" alt="${c.character.name}">
                                        <div class="p-2 text-center">
                                            <p class="small fw-bold m-0">${c.character.name}</p>
                                            <span class="text-muted" style="font-size: 0.7rem">${c.role}</span>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;

            loader.classList.add('d-none');
            contentView.innerHTML = html;
            contentView.style.opacity = '1';
            contentView.style.transition = 'opacity 0.5s ease-in';

        } catch (error) {
            contentView.innerHTML = `<p class="text-center text-danger">Error fetching details. Refresh and try again.</p>`;
        }
    }

    document.addEventListener('DOMContentLoaded', () => loadDetails(21, 'one-piece'));
</script>

</body>
</html>
