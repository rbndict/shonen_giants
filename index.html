<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shonen Archive | Big Three</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --accent: #ff4500;
            --bg-dark: #0a0a0a;
            --card-bg: #141414;
        }

        body {
            background-color: var(--bg-dark);
            color: #ececec;
            font-family: 'Plus Jakarta Sans', sans-serif;
            letter-spacing: -0.02em;
        }

        .navbar-brand {
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--accent) !important;
        }

        .anime-card {
            background: var(--card-bg);
            border: 1px solid #222;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            height: 100%;
        }

        .anime-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(255, 69, 0, 0.1);
        }

        .card-img-container {
            height: 380px;
            overflow: hidden;
            position: relative;
        }

        .card-img-top {
            height: 100%;
            width: 100%;
            object-fit: cover;
        }

        .score-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            border: 1px solid var(--accent);
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .btn-action {
            background-color: var(--accent);
            color: white;
            border: none;
            font-weight: 600;
            padding: 8px 20px;
            border-radius: 8px;
        }

        .btn-action:hover {
            background-color: #e63e00;
            color: white;
        }

        #loading-spinner {
            min-height: 50vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg py-3">
    <div class="container">
        <a class="navbar-brand" href="#">LEGENDARY ARCHIVE</a>
    </div>
</nav>

<div class="container py-5">
    <header class="text-center mb-5">
        <h1 class="display-5 fw-bold mb-3">Shonen Giants</h1>
        <p class="text-muted mx-auto" style="max-width: 600px;">
            A curated look at the defining works of Oda, Kishimoto, and Kubo, powered by live API data.
        </p>
    </header>

    <div id="anime-grid" class="row g-4">
        <div id="loading-spinner" class="col-12">
            <div class="spinner-grow text-danger" role="status"></div>
        </div>
    </div>
</div>

<footer class="text-center py-5 border-top border-secondary mt-5">
    <small class="text-muted">Built with Bootstrap & Jikan API &bull; 2026</small>
</footer>

<script>
    // IDs for One Piece (21), Naruto (20), and Bleach (269)
    const seriesIds = [21, 20, 269];

    async function initializeGallery() {
        const grid = document.getElementById('anime-grid');
        let htmlContent = '';

        try {
            // Fetching all three simultaneously for speed
            const requests = seriesIds.map(id => 
                fetch(`https://api.jikan.moe/v4/anime/${id}`).then(res => res.json())
            );

            const results = await Promise.all(requests);

            results.forEach(item => {
                const anime = item.data;
                htmlContent += `
                    <div class="col-12 col-md-4">
                        <article class="card anime-card shadow-sm">
                            <div class="card-img-container">
                                <span class="score-badge">⭐ ${anime.score || 'N/A'}</span>
                                <img src="${anime.images.jpg.large_image_url}" class="card-img-top" alt="${anime.title}">
                            </div>
                            <div class="card-body d-flex flex-column">
                                <h4 class="h5 fw-bold mb-2">${anime.title}</h4>
                                <p class="text-muted small mb-4">
                                    ${anime.synopsis ? anime.synopsis.substring(0, 140) + '...' : 'No description available.'}
                                </p>
                                <div class="mt-auto d-flex justify-content-between align-items-center">
                                    <span class="badge bg-dark border border-secondary text-secondary">${anime.episodes || '??'} EPS</span>
                                    <a href="${anime.url}" target="_blank" class="btn btn-action btn-sm">Details</a>
                                </div>
                            </div>
                        </article>
                    </div>
                `;
            });

            grid.innerHTML = htmlContent;

        } catch (err) {
            console.error("Fetch error:", err);
            grid.innerHTML = `<div class="col-12 text-center text-danger">Failed to load archive. Check your connection.</div>`;
        }
    }

    // Run on load
    document.addEventListener('DOMContentLoaded', initializeGallery);
</script>

</body>
</html>
